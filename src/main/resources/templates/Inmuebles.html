<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis inmuebles</title>

    <link rel="stylesheet" href="/css/base.css">
	<link rel="stylesheet" href="/css/inmuebles.css">
</head>

<body class="fondo-estatico">
	
<!-- SLIDESHOW -->

<div class="slideshow-bg">

	   <div class="slide active"
	         style="background-image: url('/img/casa1.avif');">
	   </div>

	   <div class="slide"
	         style="background-image: url('/img/casa2.avif');">
	   </div>

	   <div class="slide"
	         style="background-image: url('/img/casa3.webp');">
	   </div>

</div>

<header class="topbar">
    <span class="empresa">Oasis</span>
</header>

<div class="container">

    <h1>Mis inmuebles</h1>
    <hr class="line">

    <!-- Sin inmuebles -->
    <div th:if="${#lists.isEmpty(inmuebles)}" class="empty-state">
        <p>No tienes inmuebles registrados.</p>
    </div>

    <!-- Con inmuebles -->
    <div th:if="${!#lists.isEmpty(inmuebles)}" class="grid-inmuebles">

        <div th:each="inmueble : ${inmuebles}" class="card-inmueble">

            <!-- Imagen placeholder -->
            <div class="card-imagen">
                <img src="/img/inmueble-placeholder.jpg" alt="Imagen del inmueble">
            </div>

            <!-- Contenido -->
            <div class="card-contenido">

                <h2 th:text="${inmueble.direccion}">Direccion</h2>

                <p class="precio">
                    <span th:text="${inmueble.precio_noche}"></span> € / noche
                </p>

                <!-- Acciones -->
                <div class="acciones">

                    <a th:href="@{/anadirDisponibilidad/{id}(id=${inmueble.id})}">
                        <button type="button">Añadir fechas</button>
                    </a>

                    <a th:href="@{/reservas/{id}(id=${inmueble.id})}">
                        <button type="button">Ver reservas</button>
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Navegacion -->
    <div class="links">

        <a th:href="@{/homePropietario}">
            <button type="button">Volver</button>
        </a>

        <a th:href="@{/registrarInmueble}">
            <button type="button">Registrar nuevo inmueble</button>
        </a>

    </div>

</div>

<!-- SCRIPT SLIDESHOW -->

<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;

    setInterval(() => {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }, 5000);

</script>

</body>
</html>

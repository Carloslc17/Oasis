<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo inquilino</title>
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>
    <div class="slideshow-bg">
        <div class="slide" style="background-image: url('/img/casa1.avif');"></div>
        <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
        <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
    </div>
    <header class="topbar">Oasis</header>
    <div class="page-wrapper">
        <div class="container">
            <h1>Nuevo inquilino</h1>
            <hr class="line">
            <form th:action="@{/inquilino}" th:object="${usuario}" method="post" class="form">
                <label>Login:</label>
                <input type="text" th:field="*{login}" required>
                <label>Contraseña:</label>
                <input type="password" th:field="*{password}" required>
                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" required>
                <label>Apellidos:</label>
                <input type="text" th:field="*{apellidos}" required>
                <label>Dirección:</label>
                <input type="text" th:field="*{direccion}" required>
                <button type="submit">Registrar</button>
            </form>
            <div class="links">
                <a th:href="@{/registro}">Volver</a>
                <p>¿Ya tienes cuenta? <a th:href="@{/doLogin}">Iniciar sesión</a></p>
            </div>
        </div>
    </div>
    <script>
        const slides = document.querySelectorAll('.slide');
        let current = 0;
        slides[current].classList.add('active');
        setInterval(function() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }, 5000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/inmuebles.css">
</head>
<body>

<div class="slideshow-bg">
    <div class="slide active" style="background-image: url('/img/casa1.avif');"></div>
    <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
    <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
</div>

<header class="topbar">
    <div class="logo-section">
        <div class="logo-dot"></div>
        <span class="logo-text">Oasis</span>
    </div>
</header>

<div class="page-wrapper">
    <div class="container container-ancho">

        <div class="results-header">
            <div>
                <h1 style="color: white; text-shadow: none;">Solicitudes y reservas</h1>
                <p style="color: rgba(255,255,255,0.75);">Gestiona las solicitudes realizadas por los inquilinos</p>
            </div>
        </div>
        <hr class="line">

        <div th:if="${#lists.isEmpty(solicitudes)}" class="empty-state">
            <p>No hay solicitudes pendientes.</p>
        </div>

        <div th:if="${!#lists.isEmpty(solicitudes)}" class="grid-inmuebles">
            <div th:each="sol : ${solicitudes}" class="card-inmueble">
                <div class="card-imagen">
                    <img src="/img/inmueble-placeholder.jpg" alt="Inmueble">
                </div>
                <div class="card-contenido">
                    <h2 th:text="${sol.inmueble.direccion}">Dirección</h2>
                    <p class="precio"><span th:text="${sol.inmueble.precio_noche}"></span> € / noche</p>

                    <div class="disponibilidades">
                        <div class="disponibilidad-card">
                            <p><strong>Inquilino:</strong> <span th:text="${sol.inquilino.login}"></span></p>
                            <p><strong>Fechas:</strong> <span th:text="${sol.fechaInicio}"></span> - <span th:text="${sol.fechaFin}"></span></p>
                            <p><strong>Estado:</strong> 
                                <span th:if="${sol.confirmada}">Confirmada</span>
                                <span th:unless="${sol.confirmada}">Pendiente</span>
                            </p>

                            <form th:action="@{/reservas/solicitud}" method="get">
                                <input type="hidden" name="idSolicitud" th:value="${sol.id}">
                                <button type="submit" style="margin-top: 10px;">Confirmar reserva</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="links" style="margin-top: 20px;">
            <a th:href="@{/homePropietario}"><button type="button">Volver</button></a>
        </div>

    </div>
</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    setInterval(() => {
        if(slides.length > 0) {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }
    }, 5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Reservar inmueble</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/form.css">

</head>

<body>
	<div class="slideshow-bg">
	    <div class="slide active" style="background-image: url('/img/casa1.avif');"></div>
	    <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
	    <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
	</div>

<!-- TOPBAR -->

<header class="topbar">

    <div class="logo-section">

        <div class="logo-dot"></div>

        <span class="logo-text">
            Oasis
        </span>

    </div>

</header>

<!-- WRAPPER -->

<div class="page-wrapper">

    <div class="container">

        <!-- HEADER -->

        <div class="login-header">

            <h1>Confirmar reserva</h1>

            <p>
                Revisa los datos antes de continuar
            </p>

        </div>

        <!-- FORM -->

        <form th:action="@{/reservarInmueble}"
              method="post"
              class="form">

            <!-- ID -->

            <input type="hidden"
                   name="idDisponibilidad"
                   th:value="${disponibilidad.id}">

            <!-- DIRECCION -->

            <div class="input-group">

                <label>Dirección</label>

                <input type="text"
                       th:value="${disponibilidad.inmueble.direccion}"
                       readonly>

            </div>

            <!-- FECHA INICIO -->

            <div class="input-group">

                <label>Fecha inicio</label>

                <input type="text"
                       th:value="${disponibilidad.fechaInicio}"
                       readonly>

            </div>

            <!-- FECHA FIN -->

            <div class="input-group">

                <label>Fecha fin</label>

                <input type="text"
                       th:value="${disponibilidad.fechaFin}"
                       readonly>

            </div>

            <!-- PRECIO -->

            <div class="input-group">

                <label>Precio</label>

                <input type="text"
                       th:value="${disponibilidad.precio + ' €'}"
                       readonly>

            </div>

            <!-- RESERVA INMEDIATA -->

            <div class="input-group">

                <label>Reserva inmediata</label>

                <input type="text"
                       th:value="${disponibilidad.directa ? 'Sí' : 'No'}"
                       readonly>

            </div>

            <!-- POLITICA -->

            <div class="input-group">

                <label>Política cancelación</label>

                <input type="text"
                       th:value="${disponibilidad.politicaCancelacion}"
                       readonly>

            </div>

            <!-- BOTON -->

            <button type="submit"
                    class="login-btn">

                Confirmar reserva

            </button>

        </form>

        <!-- LINKS -->

        <div class="links">

            <a th:href="@{/busqueda}"
               class="secondary-link">

                Volver

            </a>

        </div>

    </div>

</div>


<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;

    setInterval(() => {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }, 5000);

</script>

</body>

</html>

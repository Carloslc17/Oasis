<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Confirmar solicitud</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/form.css">
</head>

<body class="fondo-estatico">

<!-- SLIDESHOW -->

<div class="slideshow-bg">

    <div class="slide active"
         style="background-image: url('/img/casa1.avif');">
    </div>

    <div class="slide"
         style="background-image: url('/img/casa2.avif');">
    </div>

    <div class="slide"
         style="background-image: url('/img/casa3.webp');">
    </div>

</div>

<!-- TOPBAR -->

<header class="topbar">

    <div class="logo-section">

        <div class="logo-dot"></div>

        <span class="logo-text">
            Oasis
        </span>

    </div>

</header>

<!-- WRAPPER -->

<div class="page-wrapper">

    <div class="container">

        <div class="login-header">

            <h1>Confirmar solicitud</h1>

            <p>
                Revisa los datos antes de aceptar la reserva
            </p>

        </div>

        <form th:action="@{/confirmarReserva}"
              method="post"
              class="form">

            <input type="hidden"
                   name="idSolicitud"
                   th:value="${solicitud.id}">

            <div class="input-group">

                <label>Inmueble</label>

                <input type="text"
                       th:value="${solicitud.inmueble.direccion}"
                       readonly>

            </div>

            <div class="input-group">

                <label>Inquilino</label>

                <input type="text"
                       th:value="${solicitud.inquilino.nombre}"
                       readonly>

            </div>

            <div class="input-group">

                <label>Fecha inicio</label>

                <input type="text"
                       th:value="${solicitud.fechaInicio}"
                       readonly>

            </div>

            <div class="input-group">

                <label>Fecha fin</label>

                <input type="text"
                       th:value="${solicitud.fechaFin}"
                       readonly>

            </div>

            <div class="input-group">

                <label>Política de cancelación</label>

                <input type="text"
                       th:value="${solicitud.politicaCancelacion}"
                       readonly>

            </div>

            <button type="submit"
                    class="login-btn">

                Confirmar reserva

            </button>

        </form>

        <div class="links">

            <a th:href="@{/reservas}">
                <button type="button"
                        class="login-btn"
                        style="margin-top:10px;">
                    Volver
                </button>
            </a>

        </div>

    </div>

</div>

<script>

    const slides = document.querySelectorAll('.slide');

    let current = 0;

    setInterval(() => {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }, 5000);

</script>

</body>
</html>

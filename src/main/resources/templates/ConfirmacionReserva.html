<!DOCTYPE html>
<html lang="es" xmns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reservas pendientes</title>

    <link rel="stylesheet" href="/css/formulario.css">
</head>

<body>

<header class="topbar">
    <span class="empresa">Oasis</span>
</header>

<div class="container">

    <h1>Solicitudes pendientes</h1>
    <hr class="line">

    <div th:if="${#lists.isEmpty(solicitudes)}">
        <p>No hay solicitudes pendientes.</p>
    </div>

    <div th:if="${!#lists.isEmpty(solicitudes)}">

        <ul class="lista-resultados">

            <li th:each="sol : ${solicitudes}"
                class="resultado">

                <p>
                    <strong>Inmueble:</strong>
					<span th:text= "${sol.inmueble.direccion}"> </span>
                </p>

                <p>
                    <strong>Inquilino:</strong>
					<span th:text= "${sol.inquilino.nombre}"> </span>
                </p>

                <p>
                    <strong>Fechas:</strong>
					<span th:text= "${sol.fechaInicio}"> </span>
					-
					<span th:text= "${sol.fechaFin}"> </span>
                </p>

                <form th:action=
                      "@{/aceptarReserva}"
                      method="post">

                    <input type="hidden" name="idSolicitud" th:value="${sol.id}">

                    <button type="submit"> Aceptar </button>

                </form>

            </li>

        </ul>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Confirmar reserva</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/form.css">

</head>

<body class="fondo-estatico">

<!-- TOPBAR -->
<header class="topbar">

    <div class="logo-section">

        <div class="logo-dot"></div>

        <span class="logo-text">
            Oasis
        </span>

    </div>

</header>

<!-- CONTENIDO -->
<div class="page-wrapper">

    <div class="container">

        <!-- HEADER -->
        <div class="login-header">

            <h1>Confirmar solicitud</h1>

            <p>
                Revisa los datos antes de aceptar
                la reserva
            </p>

        </div>

        <hr class="line">

        <!-- FORM -->
        <form th:action="@{/confirmarReserva}"
              method="post"
              class="form">

            <!-- ID -->
            <input type="hidden"
                   name="idSolicitud"
                   th:value="${solicitud.id}">

            <!-- INMUEBLE -->
            <div class="input-group">

                <label>Inmueble</label>

                <input type="text"
                       th:value="${solicitud.inmueble.direccion}"
                       readonly>

            </div>

            <!-- INQUILINO -->
            <div class="input-group">

                <label>Inquilino</label>

                <input type="text"
                       th:value="${solicitud.inquilino.nombre}"
                       readonly>

            </div>

            <!-- FECHA INICIO -->
            <div class="input-group">

                <label>Fecha inicio</label>

                <input type="text"
                       th:value="${solicitud.fechaInicio}"
                       readonly>

            </div>

            <!-- FECHA FIN -->
            <div class="input-group">

                <label>Fecha fin</label>

                <input type="text"
                       th:value="${solicitud.fechaFin}"
                       readonly>

            </div>

            <!-- BOTON -->
            <button type="submit"
                    class="login-btn">

                Confirmar reserva

            </button>

        </form>

        <!-- LINKS -->
        <div class="links">

            <a th:href="@{/reservas}"
               class="secondary-link">

                Volver

            </a>

        </div>

    </div>

</div>

</body>
</html>

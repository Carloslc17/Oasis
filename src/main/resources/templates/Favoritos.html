<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis favoritos</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/inmuebles.css">
</head>

<body>
	<div class="slideshow-bg">
	    <div class="slide active" style="background-image: url('/img/casa1.avif');"></div>
	    <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
	    <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
	</div>

<header class="topbar">
    <div class="logo-section">
        <div class="logo-dot"></div>
        <span class="logo-text">Oasis</span>
    </div>
</header>

<div class="page-wrapper">

    <div class="container container-ancho">

        <div class="results-header">
            <div>
                <h1 style="color: white; text-shadow: none;">Mis favoritos</h1>
                <p style="color: rgba(255,255,255,0.75);">Tus inmuebles guardados</p>
            </div>
        </div>

        <hr class="line">

        <div th:if="${#lists.isEmpty(favoritos)}" class="empty-state">
            <p>Todavía no tienes inmuebles favoritos.</p>
        </div>

        <div th:if="${!#lists.isEmpty(favoritos)}" class="grid-inmuebles">

            <div th:each="inmueble : ${favoritos}" class="card-inmueble">

                <div class="card-imagen">
                    <img src="/img/inmueble-placeholder.jpg" alt="Imagen inmueble">
                </div>

                <div class="card-contenido">

                    <h2 th:text="${inmueble.direccion}">Direccion</h2>
                    <p class="precio"><span th:text="${inmueble.precio_noche}"></span> € / noche</p>

                    <div class="disponibilidades">
                        <div th:each="disp : ${inmueble.disponibilidades}" class="disponibilidad-card">
                            <p><strong>Disponible:</strong> <span th:text="${disp.fechaInicio}"></span> - <span th:text="${disp.fechaFin}"></span></p>
                            <p><strong>Politica:</strong> <span th:text="${disp.politicaCancelacion}"></span></p>

                            <form th:action="@{/reservarInmueble}" method="get">
                                <input type="hidden" name="idDisponibilidad" th:value="${disp.id}">
                                <button type="submit" class="login-btn" style="margin-top: 10px; padding: 0.5rem; font-size: 0.9rem;">
                                    <span th:if="${disp.directa}">Reservar ahora</span>
                                    <span th:unless="${disp.directa}">Solicitar reserva</span>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="links" style="flex-direction: row; justify-content: center;">
            <a th:href="@{/homeInquilino}" class="secondary-link" style="width: auto;">Volver</a>
            <a th:href="@{/busqueda}" class="secondary-link" style="width: auto;">Buscar inmuebles</a>
        </div>

    </div>

</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }, 5000);
</script>

</body>
</html>

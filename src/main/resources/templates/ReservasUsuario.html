<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis reservas</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/inmuebles.css">
</head>
<body>

<div class="slideshow-bg">
    <div class="slide active" style="background-image: url('/img/casa1.avif');"></div>
    <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
    <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
</div>

<header class="topbar">
    <div class="logo-section">
        <div class="logo-dot"></div>
        <span class="logo-text">Oasis</span>
    </div>
</header>

<div class="page-wrapper">
    <div class="container container-ancho">
        
        <h1 style="color: white; text-shadow: none;">Mis reservas</h1>
        <hr class="line">

        <div th:if="${#lists.isEmpty(reservas)}" class="empty-state">
            <p>No tienes reservas realizadas.</p>
        </div>

        <div th:if="${!#lists.isEmpty(reservas)}" class="grid-inmuebles">
            <div th:each="reserva : ${reservas}" class="card-inmueble">
                <div class="card-imagen">
                    <img src="/img/inmueble-placeholder.jpg" alt="Imagen inmueble">
                </div>
                <div class="card-contenido">
                    <h2 th:text="${reserva.inmueble.direccion}">Direccion</h2>
                    <p class="precio"><span th:text="${reserva.inmueble.precio_noche}"></span> €/noche</p>
                    
                    <p style="color: rgba(255,255,255,0.85);"><strong>Estancia:</strong> <span th:text="${reserva.fechaInicio}"></span> - <span th:text="${reserva.fechaFin}"></span></p>
                    <p style="color: rgba(255,255,255,0.85);"><strong>Estado pago:</strong> 
                        <span th:if="${reserva.pago != null}">Pagado</span>
                        <span th:if="${reserva.pago == null}">Pendiente</span>
                    </p>

                    <div th:if="${reserva.pago == null and reserva.confirmada}">
                        <form th:action="@{/completarPago}" method="get">
                            <input type="hidden" name="idReserva" th:value="${reserva.id}" />
                            <button type="submit" class="login-btn" style="margin-top: 10px;">Pagar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="links" style="margin-top: 20px;">
            <a th:href="@{/homeInquilino}"><button type="button">Volver</button></a>
        </div>
        
    </div>
</div>

<script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    setInterval(() => {
        if(slides.length > 0) {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }
    }, 5000);
</script>
</body>
</html>

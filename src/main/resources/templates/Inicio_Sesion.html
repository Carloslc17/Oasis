<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/formulario.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <!-- Fondo slideshow -->
    <div class="slideshow-bg">
        <div class="slide active" style="background-image: url('/img/casa1.avif');"></div>
        <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
        <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
    </div>

    <!-- Topbar -->
    <header class="login-topbar">

        <div class="logo-section">
            <span class="logo-dot"></span>
            <span class="logo-text">Oasis</span>
        </div>

    </header>

    <!-- Contenido -->
    <div class="page-wrapper">

        <div class="container login-container">

            <div class="login-header">
                <h1>Bienvenido</h1>
                <p>Accede a la aplicacion</p>
            </div>

            <hr class="line">

            <form th:action="@{/doLogin}" method="post" class="form">

                <div class="input-group">

                    <label for="username">Usuario</label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="johndoe@email.com"
                        required>

                </div>

                <div class="input-group">

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="••••••••"
                        required>

                </div>

                <button type="submit" class="login-btn">
                    Iniciar sesion
                </button>

                <div th:if="${param.error}" class="error-box">
                    Credenciales incorrectas
                </div>

            </form>

            <div class="links">

                <p>
                    ¿No tienes cuenta?
                    <a th:href="@{/registro}">
                        Crear cuenta
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script>

        const slides = document.querySelectorAll('.slide');

        let current = 0;

        setInterval(() => {

            slides[current].classList.remove('active');

            current = (current + 1) % slides.length;

            slides[current].classList.add('active');

        }, 5000);

    </script>

</body>
</html>

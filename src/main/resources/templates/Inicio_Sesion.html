<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion</title>
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>

	<div class="slideshow-bg">
	        <div class="slide" style="background-image: url('/img/casa1.avif');"></div>
	        <div class="slide" style="background-image: url('/img/casa2.avif');"></div>
	        <div class="slide" style="background-image: url('/img/casa3.webp');"></div>
	    </div>

	    <header class="topbar">Oasis</header>

	    <div class="page-wrapper">
	        <div class="container">

	            <h1>Iniciar sesión</h1>
	            <hr class="line">

	            <form th:action="@{/doLogin}" method="post" class="form">

	                <label for="username">Login:</label>
	                <input type="text" name="username" id="username" required>

	                <label for="password">Contraseña:</label>
	                <input type="password" name="password" id="password" required>

	                <button type="submit">Iniciar sesion</button>

	                <div th:if="${param.error}">
	                    <p style="color:#c0392b;font-size:0.88rem;margin-top:6px;">
	                        Credenciales incorrectas
	                    </p>
	                </div>

	            </form>

	            <div class="links">
	                <p>
	                    ¿No tienes cuenta?
	                    <a th:href="@{/registro}">Registrarse</a>
	                </p>
	            </div>

	        </div>
	    </div>
		
    <script>
        const slides = document.querySelectorAll('.slide');
        let current = 0;
        slides[current].classList.add('active');
        setInterval(function() {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }, 5000);
    </script>
</body>
</html>
